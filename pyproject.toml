[project]
name = "mcp-stockflow"
version = "2.1.0"
description = "Typed FastMCP tools for Yahoo Finance stock data"
requires-python = ">=3.12,<3.15"
dependencies = ["fastmcp==3.4.7", "mcp==1.29.1", "yfinance==1.7.0", "pandas==3.0.5", "numpy==2.5.2", "pydantic==2.13.5"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=stockflow.domain --cov=stockflow.provider --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
ignore=["FURB162"]
[tool.mypy]
ignore_missing_imports=true
exclude="^stockflow\\.py$"
